name: Update EPRX primary reserve prompt data

on:
  schedule:
    # 매일 06:00 JST. GitHub Actions cron은 UTC 기준이며 전날 21:00입니다.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-eprx-primary-prompt-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EPRX_AUTOMATION_APPROVED: "true"
      EPRX_USER_AGENT: >-
        LX-International-Japan-Market-Monitor/1.0
        (EPRX-approved; internal-analysis; daily-download)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install downloader dependencies
        run: >-
          python -m pip install
          "numpy>=2,<3"
          "pandas>=2.2,<4"
          "requests>=2.31,<3"
          "beautifulsoup4>=4.12,<5"
          "openpyxl>=3.1,<4"

      - name: Download and validate EPRX prompt ZIP
        id: eprx-download
        continue-on-error: true
        run: python -m utils.eprx_prompt_downloader

      - name: Commit request state and validated EPRX prompt CSVs
        if: always()
        shell: bash
        run: |
          git add -A -- 'data/eprx/raw/'
          if [[ -f 'data/eprx/metadata/eprx_prompt_auto_download_state.json' ]]; then
            git add -- 'data/eprx/metadata/eprx_prompt_auto_download_state.json'
          fi
          if git diff --cached --quiet; then
            echo "EPRX prompt data has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update EPRX primary reserve prompt data"
          git push

      - name: Report downloader failure
        if: steps.eprx-download.outcome == 'failure'
        run: exit 1
